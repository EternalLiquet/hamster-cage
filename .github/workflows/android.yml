name: Android build and checks
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Install Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
      - name: Unit tests, lint, APK and manifest
        run: ./gradlew :core-domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:writeDependencyInventory
      - name: Audit privacy boundary
        run: python3 scripts/security_check.py
      - name: Audit resolved runtime dependencies
        run: python3 scripts/dependency_audit.py
      - name: Record artifact provenance
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/hamster-cage-preview.apk
          sha256sum dist/hamster-cage-preview.apk > dist/SHA256SUMS
          printf 'Source commit: %s\nBuild: debug preview; not production signing.\n' "$GITHUB_SHA" > dist/BUILD.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hamster-cage-preview-${{ github.sha }}
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            core-domain/build/reports/tests/
            app/build/reports/
          retention-days: 14
  instrumentation:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 platform-tools'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest
            adb shell am start -n dev.hamstercage.preview/dev.hamstercage.MainActivity
            sleep 3
            mkdir -p app/build/reports/screenshots
            adb exec-out screencap -p > app/build/reports/screenshots/dashboard.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/reports/screenshots/
          retention-days: 14
