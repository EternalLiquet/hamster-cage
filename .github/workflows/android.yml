name: Android build and checks
on:
  pull_request:
  push:
    branches: [master, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit tests, lint, APK and manifest
        run: ./gradlew :core-domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Audit privacy boundary
        run: python3 scripts/security_check.py
      - name: Record artifact provenance
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/hamster-cage-preview.apk
          sha256sum dist/hamster-cage-preview.apk > dist/SHA256SUMS
          printf 'Source commit: %s\nBuild: debug preview; not production signing.\n' "$GITHUB_SHA" > dist/BUILD.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hamster-cage-preview-${{ github.sha }}
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            core-domain/build/reports/tests/
            app/build/reports/
          retention-days: 14
