name: Android build and checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  today-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify wrapper before executing Gradle
        run: python3 scripts/verify_wrapper.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 platform-tools'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb logcat -G 16M
            adb logcat -c
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.hamstercage.ui.TodayProofScreenshotTest
            adb logcat -d -v raw -s TODAYPROOF:I > proof.txt
      - name: Publish screenshots as annotations 1
        run: python3 proof.py 1-confirmed
      - name: Publish screenshots as annotations 2
        run: python3 proof.py 2-untracked
      - name: Publish screenshots as annotations 3
        run: python3 proof.py 3-unconfirmed
      - name: Publish screenshots as annotations 4
        run: python3 proof.py 4-arriving
      - name: Publish screenshots as annotations 5
        run: python3 proof.py 5-untracked-200pct
